name = "spark-subscription-worker"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 本地调试变量；生产环境请改用 `wrangler secret put` 或 Dashboard 配置，不要写进仓库
[vars]
# APPLE_SHARED_SECRET = "你的 Apple 共享密钥（App Store Connect → App 内购买项目 → 共享密钥）"
# RC_WEBHOOK_SECRET  = "你的 RevenueCat Webhook 共享密钥（RevenueCat → Apps → 你的 App → Webhooks）"

# 持久化会员状态（可选但推荐）：
# 1) 创建命名空间：wrangler kv namespace create SPARK_KV
# 2) 把返回的 id 填到下面的 id
# [[kv_namespaces]]
# binding = "SPARK_KV"
# id = "这里填你的KV命名空间ID"
