<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>闪写 Spark · 封面主题引擎预览</title>
<style>
  body{margin:0;background:#0f1320;color:#e8ecf6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9aa1b8;font-size:13px;margin-bottom:26px}
  .sample{margin-bottom:40px}
  .sample h2{font-size:15px;color:#8fb6ff;margin:0 0 14px;border-left:3px solid #5b76ff;padding-left:10px}
  .row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .blk{background:#161b2e;border:1px solid #283150;border-radius:14px;padding:12px}
  .blk .cap{font-size:11px;color:#9aa1b8;margin-bottom:8px}
  .wechat{width:430px;aspect-ratio:900/383;border-radius:12px;overflow:hidden}
  .video{width:200px;aspect-ratio:9/16;border-radius:12px;overflow:hidden}
  .xhs-grid{display:grid;grid-template-columns:repeat(2,190px);gap:10px}
  .xhs-grid > div{aspect-ratio:3/4;border-radius:10px;overflow:hidden}
  .html-box{width:100%;height:100%}
  .html-box > *{width:100%;height:100%;display:block}
  .tip{color:#ffd166;font-size:12px;margin-top:8px;max-width:430px;line-height:1.6}
</style>
</head>
<body>
<h1>✨ 闪写 Spark · 封面主题引擎预览</h1>
<div class="sub">配色随主题切换（红白不再是唯一），渐变 + 光晕 + 主题水印 + 装饰图形。下方为各主题真实渲染（与 App 内一致，最终由 html2canvas 导出为 PNG）。</div>
<div id="app"></div>

<script src="cover_engine.js"></script>
<script>
  var samples = [
    {
      name: '主题：财经 · 「年轻人为什么不爱存钱」',
      theme: 'finance',
      title: '存钱不如花钱？这届年轻人把“安全感”重新定义了',
      golden: '不是不焦虑钱，是终于算清了：复利跑不赢房租，体验拖不起。',
      cardLines: ['存钱不如花钱\n这届年轻人重定义安全感', '工资到手就消失\n存钱像没存', '先留体验金\n再谈储蓄']
    },
    {
      name: '主题：科技 · 「AI 会不会取代程序员」',
      theme: 'tech',
      title: 'AI 写代码半年后，真实被替代的不是初级岗',
      golden: '被替代的不是写代码的人，是把需求想清楚的人。',
      cardLines: ['AI 写代码半年\n替代的不是初级岗', '代码能跑没人敢改\n成了最大风险', '把需求拆清楚\n才是稀缺能力']
    },
    {
      name: '主题：旅行 · 「一个人去云南旅行」',
      theme: 'travel',
      title: '一个人去云南，我把“孤独”走成了奢侈品',
      golden: '不必迁就任何人的行程，才是旅行最贵的自由。',
      cardLines: ['一个人去云南\n孤独走成奢侈品', '没人帮忙拍照\n但时间全是我的', '沙溪比大理\n安静十倍']
    },
    {
      name: '主题：美食 · 「减脂期怎么吃才不饿」',
      theme: 'food',
      title: '减脂期还在饿肚子？你只是蛋白质没吃够',
      golden: '饿不是意志力的考验，是餐盘里少了 30g 肉。',
      cardLines: ['减脂期还在饿\n蛋白质没吃够', '半夜饿醒翻冰箱\n沙拉撑不住', '每餐一掌肉\n血糖更稳']
    },
    {
      name: '主题：情感 · 「异地恋怎么维持」',
      theme: 'emotion',
      title: '异地恋熬不过的不是距离，是“看不到未来”',
      golden: '能见面却总说忙，比隔着时区更伤人。',
      cardLines: ['异地恋熬不过\n不是距离是未来', '视频变成打卡\n说完吃了吗就沉默', '约定结束时间\n不是空话']
    }
  ];

  var html = '';
  samples.forEach(function(s){
    html += '<div class="sample"><h2>' + s.name + '</h2><div class="row">';
    // 公众号封面
    html += '<div class="blk"><div class="cap">公众号封面 900×383</div><div class="wechat"><div class="html-box">' +
      CoverEngine.wechat({ theme: s.theme, title: s.title, sub: s.golden }) + '</div></div></div>';
    // 小红书 4 卡
    html += '<div class="blk"><div class="cap">小红书 4 张 3:4 图文卡</div><div class="xhs-grid">';
    var opts = { theme: s.theme, title: s.title, cardLines: s.cardLines, golden: s.golden };
    [0,1,2,3].forEach(function(i){
      html += '<div><div class="html-box">' + CoverEngine.xhsCard(opts, i) + '</div></div>';
    });
    html += '</div></div>';
    // 短视频封面
    html += '<div class="blk"><div class="cap">短视频封面 9:16</div><div class="video"><div class="html-box">' +
      CoverEngine.video({ theme: s.theme, title: s.title, sub: s.golden }) + '</div></div></div>';
    html += '</div></div>';
  });
  document.getElementById('app').innerHTML = html;
</script>
</body>
</html>
