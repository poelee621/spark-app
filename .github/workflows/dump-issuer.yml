name: Temp Dump Issuer (debug)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: macos-15
    steps:
      - name: Dump issuer to artifact
        run: |
          mkdir -p /tmp/issuerdump
          printf '%s' "${{ secrets.APPLE_API_ISSUER_ID }}" > /tmp/issuerdump/issuer.txt
          echo "done size=$(wc -c < /tmp/issuerdump/issuer.txt)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: issuer-dump
          path: /tmp/issuerdump/issuer.txt
