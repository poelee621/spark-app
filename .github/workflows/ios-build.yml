name: iOS Build & Upload to TestFlight
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps & sync iOS platform
        run: |
          npm install --legacy-peer-deps
          npx cap add ios
          npx cap sync ios

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "P12_BASE64 length: ${#P12_BASE64}"
          echo "$P12_BASE64" | base64 --decode > dist.p12
          echo "Decoded dist.p12 size: $(stat -f%z dist.p12 2>/dev/null || stat -c%s dist.p12 2>/dev/null)"
          echo "P12_PASSWORD length: ${#P12_PASSWORD}"
          openssl pkcs12 -in dist.p12 -passin pass:"$P12_PASSWORD" -nokeys -info 2>&1 | head -5
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          echo "PROFILE_BASE64 length: ${#PROFILE_BASE64}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/Spark_Distribution.mobileprovision"
          echo "Decoded profile size: $(stat -f%z "$HOME/Library/MobileDevice/Provisioning Profiles/Spark_Distribution.mobileprovision" 2>/dev/null || stat -c%s "$HOME/Library/MobileDevice/Provisioning Profiles/Spark_Distribution.mobileprovision" 2>/dev/null)"

      - name: Prepare export options
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.coldtank.spark</key>
              <string>Spark Distribution Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

            - name: Force signing settings in Xcode project
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          PBJ="ios/App/App.xcodeproj/project.pbxproj"
          TMP="${PBJ}.tmp"
          sed "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PBJ" > "$TMP" && mv "$TMP" "$PBJ"
          sed "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PBJ" > "$TMP" && mv "$TMP" "$PBJ"
          sed 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBJ" > "$TMP" && mv "$TMP" "$PBJ"
          sed 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "iPhone Distribution";/g' "$PBJ" > "$TMP" && mv "$TMP" "$PBJ"
          grep -E 'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY' "$PBJ" | head -20


      - name: Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath build/Spark.xcarchive archive -allowProvisioningUpdates

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/Spark.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA to TestFlight (altool)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app -f build/export/Spark.ipa -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spark.ipa
          path: build/export/Spark.ipa
